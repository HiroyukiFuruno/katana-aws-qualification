name: Learning data integration
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'src/progress/**'
      - 'src/history.ts'
      - 'src/exam.ts'
      - 'src/roadmapProfile.ts'
      - 'test/data/**'
      - 'scripts/run-data-integration.ts'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/data.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - run: bun run data:integration
