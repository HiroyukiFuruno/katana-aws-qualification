<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="426px" height="746px" viewBox="0 0 426 746"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="5" y="5" width="410" height="730" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="title"><g><rect x="20" y="15" width="380" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="20px" style="fill: rgb(20, 35, 54);"><text x="210" y="41">Agent proposes; application decides</text></g></g></g><g data-cell-id="user"><g transform="translate(0.5,0.5)"><rect x="115" y="62" width="190" height="44" rx="4.5" ry="4.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(217, 119, 6);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="210" y="81.5">USER</text><text x="210" y="99.5">request</text></g></g></g><g data-cell-id="app-boundary"><g transform="translate(0.5,0.5)"><rect x="21" y="125" width="378" height="590" rx="4.5" ry="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="3.9 3.9" pointer-events="all" style="fill: rgb(248, 250, 252); stroke: rgb(37, 99, 235);"/></g></g><g data-cell-id="app-label"><g><rect x="35" y="133" width="350" height="26" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="37" y="152.5">APPLICATION BOUNDARY</text></g></g></g><g data-cell-id="input"><g transform="translate(0.5,0.5)"><rect x="50" y="170" width="320" height="52" rx="4.5" ry="4.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(37, 99, 235);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="210" y="193.5">INPUT VALIDATION</text><text x="210" y="211.5">identity and required fields</text></g></g></g><g data-cell-id="agent"><g transform="translate(0.5,0.5)"><rect x="50" y="243" width="320" height="54" rx="4.5" ry="4.5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3" pointer-events="all" style="fill: rgb(237, 233, 254); stroke: rgb(124, 58, 237);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="210" y="267.5">BEDROCK AGENT</text><text x="210" y="285.5">proposes an action; it does not authorize it</text></g></g></g><g data-cell-id="knowledge"><g transform="translate(0.5,0.5)"><rect x="50" y="318" width="320" height="42" rx="4.5" ry="4.5" fill="#ecfdf5" stroke="#059669" stroke-width="1.3" pointer-events="all" style="fill: rgb(236, 253, 245); stroke: rgb(5, 150, 105);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="210" y="345">KNOWLEDGE RETRIEVAL — read-only context</text></g></g></g><g data-cell-id="gate"><g transform="translate(0.5,0.5)"><rect x="50" y="385" width="320" height="76" rx="4.5" ry="4.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 247, 237); stroke: rgb(234, 88, 12);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="210" y="411.5">APPLICATION EXECUTION GATE</text><text x="210" y="429.5">validate parameters • authorize actor</text><text x="210" y="447.5">policy, timeout, and idempotency checks</text></g></g></g><g data-cell-id="approval"><g transform="translate(0.5,0.5)"><rect x="50" y="488" width="320" height="52" rx="4.5" ry="4.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" pointer-events="all" style="fill: rgb(254, 226, 226); stroke: rgb(220, 38, 38);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="210" y="511.5">HUMAN APPROVAL — HIGH IMPACT</text><text x="210" y="528.5">show target • change • evidence</text></g></g></g><g data-cell-id="tool"><g transform="translate(0.5,0.5)"><rect x="50" y="571" width="320" height="52" rx="4.5" ry="4.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" pointer-events="all" style="fill: rgb(220, 252, 231); stroke: rgb(22, 163, 74);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="210" y="594.5">ALLOWED TOOL / API</text><text x="210" y="612.5">approved or low-impact execution</text></g></g></g><g data-cell-id="response"><g transform="translate(0.5,0.5)"><rect x="50" y="645" width="320" height="46" rx="4.5" ry="4.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(37, 99, 235);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="210" y="665.5">RESPONSE VALIDATION</text><text x="210" y="682.5">safe response or safe failure</text></g></g></g><g data-cell-id="e1"><g><path d="M 210 106 L 210 159.76" fill="none" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(37, 99, 235);"/><path d="M 210 167.76 L 206 159.76 L 214 159.76 Z" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(37, 99, 235); stroke: rgb(37, 99, 23