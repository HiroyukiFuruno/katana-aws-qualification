<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="330px" height="545px" viewBox="0 0 330 545"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="304" height="28" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(20, 35, 54);"><text x="152" y="22">IAM ロールの使われ方</text></g></g></g><g data-cell-id="caller"><g transform="translate(0.5,0.5)"><rect x="54" y="46" width="196" height="50" rx="3" ry="3" fill="#f4f8fd" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(244, 248, 253); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="152" y="68.5">呼び出し元</text><text x="152" y="85.5">ユーザー / 処理 / サービス</text></g></g></g><g data-cell-id="role"><g><rect x="2" y="146" width="300" height="241" rx="4" ry="4" fill="#fff8f6" stroke="#b87526" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 248, 246); stroke: rgb(184, 117, 38);"/></g><g data-cell-id="role-title"><g><rect x="14" y="155" width="130" height="21" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(20, 35, 54);"><text x="16" y="172.5">IAM ロール</text></g></g></g><g data-cell-id="trust"><g transform="translate(0.5,0.5)"><rect x="20" y="194" width="264" height="49" rx="3" ry="3" fill="#ffffff" stroke="#b87526" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(184, 117, 38);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="152" y="216">信頼ポリシー</text><text x="152" y="233">誰がこのロールを引き受けられるか</text></g></g></g><g data-cell-id="sts"><g transform="translate(0.5,0.5)"><rect x="48" y="264" width="208" height="44" rx="3" ry="3" fill="#fff5e7" stroke="#b87526" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 245, 231); stroke: rgb(184, 117, 38);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="152" y="283.5">AWS STS が発行</text><text x="152" y="299.5">一時的なセッション認証情報</text></g></g></g><g data-cell-id="permissions"><g transform="translate(0.5,0.5)"><rect x="20" y="325" width="264" height="49" rx="3" ry="3" fill="#ffffff" stroke="#4976a5" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="152" y="347">アクセス許可ポリシー</text><text x="152" y="364">許可するアクションとリソース</text></g></g></g></g><g data-cell-id="target"><g transform="translate(0.5,0.5)"><rect x="64" y="433" width="176" height="47" rx="3" ry="3" fill="#ecf5e9" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="152" y="454">AWS リソース</text><text x="152" y="471">例: S3 オブジェクト</text></g></g></g><g data-cell-id="assume-label"><g><rect x="175" y="99" width="123" height="29" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#8A4E12" font-family="Arial" text-anchor="start" font-size="12px" style="fill: rgb(138, 78, 18);"><text x="177" y="111.5">AssumeRole リクエスト</text><text x="177" y="125.5">信頼ポリシーでのみ許可</text></g></g></g><g data-cell-id="use-label"><g><rect x="159" y="390" width="13