<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="566px" height="894px" viewBox="0 0 566 894"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="2" y="0" width="560" height="32" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="18px" style="fill: rgb(23, 43, 77);"><text x="4" y="24">ALB から EC2: 戻り通信の制御</text></g></g></g><g data-cell-id="subtitle"><g><rect x="2" y="31" width="560" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#42526E" font-family="Helvetica" text-anchor="start" font-size="16px" style="fill: rgb(66, 82, 110);"><text x="4" y="50">バックエンドのリクエストとレスポンスを追う。</text></g></g></g><g data-cell-id="main"><g transform="translate(0.5,0.5)"><path d="M 564 104 L 564 83.1 Q 564 66 546.9 66 L 17.1 66 Q 0 66 0 83.1 L 0 104" fill="#f7fafc" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(247, 250, 252); stroke: rgb(76, 154, 255);"/><path d="M 0 104 L 0 548.9 Q 0 566 17.1 566 L 546.9 566 Q 564 566 564 548.9 L 564 104" fill="none" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(76, 154, 255);"/><path d="M 0 104 L 564 104" fill="none" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(76, 154, 255);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(23, 43, 77);"><text x="282" y="93">VPC 内の1本のバックエンド接続</text></g></g><g data-cell-id="vpc"><g transform="translate(0.5,0.5)"><path d="M 548 139 L 548 124.15 Q 548 112 535.85 112 L 28.15 112 Q 16 112 16 124.15 L 16 139" fill="#ffffff" stroke="#36b37e" stroke-miterlimit="10" pointer-events=