-id="public-rules"><g transform="translate(0.5,0.5)"><rect x="67" y="417" width="180" height="51" rx="7.65" ry="7.65" fill="#ffffff" stroke="#8993a4" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(137, 147, 164);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(23, 43, 77);"><text x="157" y="440">NACL OUT: destination TCP 443</text><text x="157" y="457">NACL IN: destination TCP 49152</text></g></g></g></g><g data-cell-id="private"><g transform="translate(0.5,0.5)"><path d="M 521 222 L 521 207.15 Q 521 195 508.85 195 L 325.15 195 Q 313 195 313 207.15 L 313 222" fill="#f6f4ff" stroke="#6554c0" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(246, 244, 255); stroke: rgb(101, 84, 192);"/><path d="M 313 222 L 313 474.85 Q 313 487 325.15 487 L 508.85 487 Q 521 487 521 474.85 L 521 222" fill="none" stroke="#6554c0" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(101, 84, 192);"/><path d="M 313 222 L 521 222" fill="none" stroke="#6554c0" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(101, 84, 192);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(23, 43, 77);"><text x="417" y="215">Private EC2 subnet</text></g></g><g data-cell-id="private-nacl"><g transform="translate(0.5,0.5)"><rect x="327" y="231" width="180" height="25" rx="3.75" ry="3.75" fill="#fff7d6" stroke="#ffab00" pointer-events="all" style="fill: rgb(255, 247, 214); stroke: rgb(255, 171, 0);"/></g><g><g fill="#594300" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(89, 67, 0);"><text x="417" y="249.5">NACL — subnet boundary</text></g></g></g><g data-cell-id="ec2-sg"><g transform="translate(0.5,0.5)"><rect x="338" y="275" width="158" height="82" rx="12.3" ry="12.3" fill="#eef6ff" stroke="#2684ff" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(238, 246, 255); stroke: rgb(38, 132, 255);"/></g><g><g fill="#0747A6" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(7, 71, 166);"><text x="417" y="300">EC2 SG (ENI)</text></g></g><g data-cell-id="ec2"><g transform="translate(0.5,0.5)"><rect x="358" y="309" width="118" height="31" rx="4.65" ry="4.65" fill="#ffffff" stroke="#5e6c84" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(94, 108, 132);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="19px" style="fill: rgb(23, 43, 77);"><text x="417" y="333">EC2</text></g></g></g></g><g data-cell-id="private-rules"><g transform="translate(0.5,0.5)"><rect x="327" y="417" width="180" height="51" rx="7.65" ry="7.65" fill="#ffffff" stroke="#8993a4" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(137, 147, 164);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(23, 43, 77);"><text x="417" y="440">NACL IN: destination TCP 443</text><text x="417" y="457">NACL OUT: destination TCP 49152</text></g></g></g></g><g data-cell-id="request-label"><g><rect x="192" y="251" width="190" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0052CC" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(0, 82, 204);"><text x="287" y="269.5">Request: ALB 49152 → EC2 443</text></g></g></g><g data-cell-id="request"><g transform="translate(0.5,0.5)"><path d="M 236 316 L 325.65 316" fill="none" stroke="#0052cc" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 82, 204);"/><path d="M 334.65 316 L 325.65 320.5 L 325.65 311.5 Z" fill="#0052cc" stroke="#0052cc" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 82, 204); stroke: rgb(0, 82, 204);"/></g></g><g data-cell-id="response"><g transform="translate(0.5,0.5)"><path d="M 357.02 357 L 346.26 364.36 Q 338 370 328 370 L 246 370 Q 236 370 231.59 366.99 L 227.18 363.97" fill="none" stroke="#6554c0" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(101, 84, 192);"/><path d="M 219.75 358.89 L 229.72 360.26 L 224.64 367.69 Z" fill="#6554c0" stroke="#6554c0" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(101, 84, 192); stroke: rgb(101, 84, 192);"/></g></g><g data-cell-id="response-label"><g><rect x="192" y="388" width="190" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6554C0" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(101, 84, 192);"><text x="287" y="406.5">Response: EC2 443 → ALB 49152</text></g></g></g></g><g data-cell-id="route-note"><g><rect x="56" y="491" width="462" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#42526E" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: rgb(66, 82, 110);"><text x="287" y="509.5">The local VPC route is assumed; this diagram isolates traffic controls.</text></g></g></g></g></g><g data-cell-id="compare"><g transform="translate(0.5,0.5)"><path d="M 569 627 L 569 606.1 Q 569 589 551.9 589 L 22.1 589 Q 5 589 5 606.1 L 5 627" fill="#f7fafc" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(247, 250, 252); stroke: rgb(76, 154, 255);"/><path d="M 5 627 L 5 801.9 Q 5 819 22.1 819 L 551.9 819 Q 569 819 569 801.9 L 569 627" fill="none" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(76, 154, 255);"/><path d="M 5 627 L 569 627" fill="none" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(76, 154, 255);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(23, 43, 77);"><text x="287" y="617.5">How to decide the return path</text></g></g><g data-cell-id="compare-sg"><g transform="translate(0.5,0.5)"><rect x="23" y="637" width="248" height="152" rx="22.8" ry="22.8" fill="#eef6ff" stroke="#2684ff" pointer-events="all" style="fill: rgb(238, 246, 255); stroke: rgb(38, 132, 255);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(23, 43, 77);"><text x="41" y="669">Security group (ENI)</text><text x="41" y="703">Stateful</text><text x="41" y="720">Allow: ALB SG → EC2 SG, TCP 443</text><text x="41" y="754">Return: established flow allowed</text><text x="41" y="771">No TCP 49152 return rule.</text></g></g></g><g data-cell-id="compare-nacl"><g transform="translate(0.5,0.5)"><rect x="303" y="637" width="248" height="152" rx="22.8" ry="22.8" fill="#fff7d6" stroke="#ffab00" pointer-events="all" style="fill: rgb(255, 247, 214); stroke: rgb(255, 171, 0);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: rgb(23, 43, 77);"><text x="321" y="669">Network ACL (subnet)</text><text x="321" y="703">Stateless</text><text x="321" y="720">Request: ALB OUT + EC2 IN, 443</text><text x="321" y="754">Return: EC2 OUT + ALB IN, 49152</text><text x="321" y="771">Allow both directions explicitly.</text></g></g></g></g><g data-cell-id="footer"><g><rect x="7" y="824" width="560" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#42526E" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: rgb(66, 82, 110);"><text x="287" y="842">Example port: 49152. Allow the required ephemeral range when ports vary.</text></g></g></g></g></g></g></svg>