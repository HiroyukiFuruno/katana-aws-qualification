<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="321px" height="391px" viewBox="0 0 321 391"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="0" y="0" width="320" height="390" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="title"><g><rect x="8" y="8" width="304" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(20, 35, 54);"><text x="160" y="29.5">3つのデプロイ戦略</text></g></g></g><g data-cell-id="rolling"><g transform="translate(0.5,0.5)"><rect x="8" y="52" width="96" height="258" rx="3.5" ry="3.5" fill="#f4f8fd" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(244, 248, 253); stroke: rgb(73, 118, 165);"/></g><g data-cell-id="rolling-title"><g><rect x="16" y="60" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="56" y="76.5">ローリング</text></g></g></g><g data-cell-id="roll-old"><g transform="translate(0.5,0.5)"><rect x="25" y="97" width="58" height="24" rx="3.6" ry="3.6" fill="#e7f0fa" stroke="#4976a5" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(20, 35, 54);"><text x="54" y="114">旧</text></g></g></g><g data-cell-id="roll-new"><g transform="translate(0.5,0.5)"><rect x="25" y="131" width="58" height="24" rx="3.6" ry="3.6" fill="#ecf5e9" stroke="#638b52" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(20, 35, 54);"><text x="54" y="148">新</text></g></g></g><g data-cell-id="roll-note"><g><rect x="17" y="174" width="78" height="101" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#234D77" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(35, 77, 119);"><text x="56" y="201.5">バッチ単位で</text><text x="56" y="215.5">置き換える。</text><text x="56" y="243.5">旧版と新版が</text><text x="56" y="257.5">共存する。</text></g></g></g></g><g data-cell-id="bg"><g transform="translate(0.5,0.5)"><rect x="112" y="52" width="96" height="258" rx="3.5" ry="3.5" fill="#fff8f6" stroke="#b87526" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 248, 246); stroke: rgb(184, 117, 38);"/></g><g data-cell-id="bg-title"><g><rect x="117" y="60" width="86" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="160" y="76">ブルー / グリーン</text></g></g></g><g data-cell-id="blue"><g transform="translate(0.5,0.5)"><rect x="130" y="97" width="60" height="34" rx="5.1" ry="5.1" fill="#e7f0fa" stroke="#4976a5" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(20, 35, 54);"><text x="160" y="112">ブルー</text><text x="160" y="126">安定版</text></g></g></g><g data-cell-id="green"><g transform="translate(0.5,0.5)"><rect x="130" y="143" width="60" height="34" rx="5.1" ry="5.1" fill="#ecf5e9" stroke="#638b52" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(20, 35, 54);"><text x="160" y="158">グリーン</text><text x="160" y="172">検証済み</text></g></g></g><g data-cell-id="bg-note"><g><rect x="118" y="182" width="84" height="105" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#8A4E12" font-family="Arial" text-anchor="middle" font-size="11px" style="fill: rgb(138, 78, 18);"><text x="160" y="206.5">完全な環境を</text><text x="160" y="219.5">2つ稼働する。</text><text x="160" y="245.5">トラフィックを</text><text x="160" y="258.5">グリーンへ</text><text x="160" y="271.5">切り替える。</text></g></g></g></g><g data-cell-id="canary"><g transform="translate(0.5,0.5)"><rect x="216" y="52" width="96" height="258" rx="3.5" ry="3.5" fill="#f4fbf5" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(244, 251, 245); stroke: rgb(99, 139, 82);"/></g><g data-cell-id="canary-title"><g><rect x="224" y="60" width="80" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="264" y="76.5">カナリア</text></g></g></g><g data-cell-id="canary-old"><g transform="translate(0.5,0.5)"><rect x="227" y="97" width="74" height="24" rx="3.6" ry="3.6" fill="#e7f0fa" stroke="#4976a5" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(20, 35, 54);"><text x="264" y="114">安定版 95%</text></g></g></g><g data-cell-id="canary-new"><g transform="translate(0.5,0.5)"><rect x="227" y="131" width="74" height="24" rx="3.6" ry="3.6" fill="#ecf5e9" stroke="#638b52" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="12px" style="fill: rgb(20, 35, 54);"><text x="264" y="148">新版 5%</text></g></g></g><g data-cell-id="canary-note"><g><rect x="222" y="173" width="84" height="126" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#245633" font-family="Arial" text-anchor="middle" font-size="11px" style="fill: rgb(36, 86, 51);"><text x="264" y="208">5% を新版へ</text><text x="264" y="221">送る。</text><text x="264" y="247">結果を確認して</text><text x="264" y="260">トラフィックを</text><text x="264" y="273">増やす。</text></g></g></g></g><g data-cell-id="cue"><g transform="translate(0.5,0.5)"><rect x="8" y="327" width="304" height="46" rx="3" ry="3" fill="#ffffff" stroke="#4976a5" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="160" y="347.5">容量、影響範囲、</text><text x="160" y="363.5">トラフィックを戻す速さを比較する。</text></g></g></g></g></g></g></svg>