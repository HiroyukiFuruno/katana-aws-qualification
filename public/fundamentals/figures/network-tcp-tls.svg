<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="525px" height="530px" viewBox="0 0 525 530"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="83" y="5" width="352" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="28px" style="fill: rgb(23, 43, 77);"><text x="259" y="39">HTTPS: connection → trust → request</text></g></g></g><g data-cell-id="client"><g transform="translate(0.5,0.5)"><rect x="154" y="71" width="210" height="62" rx="9.3" ry="9.3" fill="#ffffff" stroke="#5e6c84" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(94, 108, 132);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="30px" style="fill: rgb(0, 0, 0);"><text x="259" y="116">Client</text></g></g></g><g data-cell-id="tcp"><g transform="translate(0.5,0.5)"><rect x="89" y="180" width="340" height="78" rx="11.7" ry="11.7" fill="#eaf4fe" stroke="#2684ff" pointer-events="all" style="fill: rgb(234, 244, 254); stroke: rgb(38, 132, 255);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="28px" style="fill: rgb(0, 0, 0);"><text x="259" y="215">1. TCP connection</text><text x="259" y="249">server IP + port 443</text></g></g></g><g data-cell-id="tls"><g transform="translate(0.5,0.5)"><rect x="89" y="310" width="340" height="78" rx="11.7" ry="11.7" fill="#e3fcef" stroke="#36b37e" pointer-events="all" style="fill: rgb(227, 252, 239); stroke: rgb(54, 179, 126);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="28px" style="fill: rgb(0, 0, 0);"><text x="259" y="345">2. TLS handshake</text><text x="259" y="379">name, certificate, trust</text></g></g></g><g data-cell-id="http"><g transform="translate(0.5,0.5)"><rect x="89" y="440" width="340" height="78" rx="11.7" ry="11.7" fill="#fff7d6" stroke="#ffab00" pointer-events="all" style="fill: rgb(255, 247, 214); stroke: rgb(255, 171, 0);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="28px" style="fill: rgb(0, 0, 0);"><text x="259" y="475">3. HTTP exchange</text><text x="259" y="509">method, path, and body</text></g></g></g><g data-cell-id="e1"><g><path d="M 259 133 L 259 165.53" fill="none" stroke="#0052cc" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 82, 204);"/><path d="M 259 175.53 L 254 165.53 L 264 165.53 Z" fill="#0052cc" stroke="#0052cc" stroke-width="4" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 82, 204); stroke: rgb(0, 82, 204);"/></g></g><g data-cell-id="e2"><g><path d="M 259 258 L 259 295.53" fill="none" stroke="#0052cc" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 82, 204);"/><path d="M 259 305.53 L 254 295.53 L 264 295.53 Z" fill="#0052cc" stroke="#0052cc" stroke-width="4" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 82, 204); stroke: rgb(0, 82, 204);"/></g></g><g data-cell-id="e3"><g><path d="M 259 388 L 259 425.53" fill="none" stroke="#0052cc" stroke-width="4" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 82, 204);"/><path d="M 259 435.53 L 254 425.53 L 264 425.53 Z" fill="#0052cc" stroke="#0052cc" stroke-width="4" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 82, 204); stroke: rgb(0, 82, 204);"/></g></g></g></g></g></svg>