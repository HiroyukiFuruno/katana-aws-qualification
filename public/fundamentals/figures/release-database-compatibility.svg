text-anchor="middle" font-size="13px" style="fill: rgb(35, 77, 119);"><text x="165" y="138.5">Both releases read and write the shared database</text></g></g></g><g data-cell-id="db-boundary"><g transform="translate(0.5,0.5)"><rect x="15" y="158" width="300" height="384" rx="4" ry="4" fill="#f8fafd" stroke="#4976a5" stroke-width="1.4" pointer-events="all" style="fill: rgb(248, 250, 253); stroke: rgb(73, 118, 165);"/></g><g data-cell-id="db-title"><g><rect x="27" y="166" width="270" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="29" y="182.5">Shared order database boundary</text></g></g></g><g data-cell-id="expand"><g transform="translate(0.5,0.5)"><rect x="33" y="204" width="264" height="51" rx="3" ry="3" fill="#e7f0fa" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="165" y="227">1  EXPAND</text><text x="165" y="244">Add nullable column: delivery_class</text></g></g></g><g data-cell-id="compatible"><g transform="translate(0.5,0.5)"><rect x="33" y="273" width="264" height="65" rx="3" ry="3" fill="#ecf5e9" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="165" y="295">2  COMPATIBLE</text><text x="165" y="311">Old app ignores new column</text><text x="165" y="327">New app keeps old field usable</text></g></g></g><g data-cell-id="verify"><g transform="translate(0.5,0.5)"><rect x="33" y="356" width="264" height="65" rx="3" ry="3" fill="#fff5e7" stroke="#b87526" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 245, 231); stroke: rgb(184, 117, 38);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="165" y="378">3  MIGRATE AND VERIFY</text><text x="165" y="394">Backfill order data</text><text x="165" y="410">Verify migrated values</text></g></g></g><g data-cell-id="contract"><g transform="translate(0.5,0.5)"><rect x="33" y="439" width="264" height="65" rx="3" ry="3" fill="#f3f5f7" stroke="#667788" stroke-width="1.3" pointer-events="all" style="fill: rgb(243, 245, 247); stroke: rgb(102, 119, 136);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="165" y="461">4  CONTRACT (later)</text><text x="165" y="477">Remove old column</text><text x="165" y="493">only after old app is retired</text></g></g></g></g><g data-cell-id="cue"><g transform="translate(0.5,0.5)"><rect x="15" y="560" width="300" height="48" rx="3" ry="3" fill="#ffffff" stroke="#b87526" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(184, 117, 38);"/></g><g><g fill="#4B351B" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(75, 53, 27);"><text x="165" y="581.5">Application rollback returns to old code.</text><text x="165" y="597.5">It does not undo shared database data.</text></g></g></g><g data-cell-id="e-compat"><g><path d="M 165 255 L 165 262.76" fill="none" stroke="#638b52" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(99, 139, 82);"/><path d="M 165 270.76 L 161 262.76 L 169 262.76 Z" fill="#638b52" stroke="#638b52" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(99, 139, 82); stroke: rgb(99, 139, 82);"/></g></g><g data-cell-id="e-verify"><g><path d="M 165 338 L 165 345.76" fill="none" stroke="#b87526" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(184, 117, 38);"/><path d="M 165 353.76 L 161 345.76 L 169 345.76 Z" fill="#b87526" stroke="#b87526" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(184, 117, 38); stroke: rgb(184, 117, 38);"/></g></g><g data-cell-id="e-contract"><g><path d="M 165 421 L 165 428.76" fill="none" stroke="#667788" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(102, 119, 136);"/><path d="M 165 436.76 L 161 428.76 L 169 428.76 Z" fill="#667788" stroke="#667788" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(102, 119, 136); stroke: rgb(102, 119, 136);"/></g></g></g></g></g></svg>