project_id = "katana-aws-qualification"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["http://127.0.0.1:5173/auth/callback/", "http://127.0.0.1:5173/ja/auth/callback/", "http://127.0.0.1:5173/zh-CN/auth/callback/", "http://127.0.0.1:5173/zh-TW/auth/callback/", "http://127.0.0.1:5173/ko/auth/callback/", "http://127.0.0.1:5173/pt/auth/callback/", "http://127.0.0.1:5173/fr/auth/callback/", "http://127.0.0.1:5173/de/auth/callback/", "http://127.0.0.1:5173/es/auth/callback/", "http://127.0.0.1:5173/it/auth/callback/"]
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true
enable_refresh_token_rotation = true

[auth.email]
enable_signup = false
enable_confirmations = true

[auth.sms]
enable_signup = false

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
skip_nonce_check = false
