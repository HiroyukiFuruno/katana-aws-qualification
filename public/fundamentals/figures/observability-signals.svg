<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="336px" height="576px" viewBox="0 0 336 576"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="5" y="5" width="320" height="560" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="title"><g><rect x="13" y="13" width="304" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(20, 35, 54);"><text x="165" y="34.5">Three ways to inspect a request</text></g></g></g><g data-cell-id="user"><g transform="translate(0.5,0.5)"><rect x="49" y="58" width="232" height="38" rx="3" ry="3" fill="#f4f8fd" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(244, 248, 253); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="165" y="83.5">Client</text></g></g></g><g data-cell-id="app"><g transform="translate(0.5,0.5)"><rect x="49" y="117" width="232" height="38" rx="3" ry="3" fill="#f4fbf5" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(244, 251, 245); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="165" y="142.5">Order API</text></g></g></g><g data-cell-id="db"><g transform="translate(0.5,0.5)"><rect x="49" y="176" width="232" height="38" rx="3" ry="3" fill="#fff8f6" stroke="#b87526" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 248, 246); stroke: rgb(184, 117, 38);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="165" y="201.5">Orders database</text></g></g></g><g data-cell-id="path-cue"><g><rect x="41" y="229" width="248" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#234D77" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(35, 77, 119);"><text x="165" y="243.5">One order request</text></g></g></g><g data-cell-id="metric"><g transform="translate(0.5,0.5)"><rect x="17" y="268" width="296" height="62" rx="3" ry="3" fill="#e7f0fa" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="165" y="296.5">Metric · Aggregated trend</text><text x="165" y="313.5">When did latency rise?</text></g></g></g><g data-cell-id="log"><g transform="translate(0.5,0.5)"><rect x="17" y="345" width="296" height="62" rx="3" ry="3" fill="#ecf5e9" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="165" y="373.5">Log · Event and request ID</text><text x="165" y="390.5">What error did this request report?</text></g></g></g><g data-cell-id="trace"><g transform="translate(0.5,0.5)"><rect x="17" y="422" width="296" height="62" rx="3" ry="3" fill="#fff5e7" stroke="#b87526" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 245, 231); stroke: rgb(184, 117, 38);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="165" y="450.5">Trace · Linked request spans</text><text x="165" y="467.5">Where did this request spend time?</text></g></g></g><g data-cell-id="cue"><g transform="translate(0.5,0.5)"><rect x="17" y="501" width="296" height="48" rx="3" ry="3" fill="#f4f8fd" stroke="#4976a5" stroke-width="1.2" pointer-events="all" style="fill: rgb(244, 248, 253); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="165" y="522.5">Find the change in metrics.</text><text x="165" y="538.5">Use the request ID to link logs and traces.</text></g></g></g><g data-cell-id="e1"><g><path d="M 165 96 L 165 106.76" fill="none" stroke="#234d77" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 77, 119);"/><path d="M 165 114.76 L 161 106.76 L 169 106.76 Z" fill="#234d77" stroke="#234d77" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 77, 119); stroke: rgb(35, 77, 119);"/></g></g><g data-cell-id="e2"><g><path d="M 165 155 L 165 165.76" fill="none" stroke="#234d77" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(35, 77, 119);"/><path d="M 165 173.76 L 161 165.76 L 169 165.76 Z" fill="#234d77" stroke="#234d77" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(35, 77, 119); stroke: rgb(35, 77, 119);"/></g></g></g></g></g></svg>