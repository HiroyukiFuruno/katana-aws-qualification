log_format merge_safe '$request_method $uri $status';
server {
  listen 54530;
  access_log /dev/stdout merge_safe;
  location = /health {
    return 200 'ready';
  }
  location /auth/v1/ {
    proxy_pass http://auth:9999/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto http;
  }
  location /rest/v1/ {
    proxy_pass http://rest:3000/;
    proxy_set_header Authorization $http_authorization;
  }
  location = /second-issuer/oauth2/v2.0/authorize {
    # 認証Cookieを実issuerへ保存するため、ログイン画面は中継せず移動する。
    return 302 https://kaq-merge-idp:54541/realms/merge-second/protocol/openid-connect/auth$is_args$args;
  }
  location = /second-issuer/oauth2/v2.0/token {
    proxy_pass https://kaq-merge-idp:54541/realms/merge-second/protocol/openid-connect/token;
    proxy_set_header Host kaq-merge-idp:54541;
    proxy_ssl_server_name on;
    proxy_ssl_name kaq-merge-idp;
    proxy_ssl_trusted_certificate /etc/kaq-merge/server.crt;
    proxy_ssl_verify on;
  }
}
