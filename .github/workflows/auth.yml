name: Auth integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/brand/**'
      - 'test/auth/**'
      - 'scripts/*auth*'
      - 'scripts/check-account-build.ts'
      - 'scripts/check-landing-build.ts'
      - 'scripts/render-routes.ts'
      - 'supabase/**'
      - 'patches/**'
      - 'package.json'
      - 'bun.lock'
      - 'playwright.config.ts'
      - 'tsconfig.json'
      - 'biome.json'
      - '.dependency-cruiser.cjs'
      - '.github/workflows/auth.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bun run auth:integration
