<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="361px" height="584px" viewBox="0 0 361 584"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="0" y="0" width="360" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(23, 43, 77);"><text x="180" y="24">DNS TTL: 2つの応答が共存</text></g></g></g><g data-cell-id="a"><g transform="translate(0.5,0.5)"><rect x="5" y="70" width="350" height="116" rx="17.4" ry="17.4" fill="#eaf4fe" stroke="#2684ff" pointer-events="all" style="fill: rgb(234, 244, 254); stroke: rgb(38, 132, 255);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(0, 0, 0);"><text x="180" y="103">09:00</text><text x="180" y="125">リゾルバー A が</text><text x="180" y="147">api.example = 198.51.100.11 を</text><text x="180" y="169">TTL 300 秒でキャッシュ</text></g></g></g><g data-cell-id="change"><g transform="translate(0.5,0.5)"><rect x="5" y="226" width="350" height="92" rx="13.8" ry="13.8" fill="#fff7d6" stroke="#ffab00" pointer-events="all" style="fill: rgb(255, 247, 214); stroke: rgb(255, 171, 0);"/></g><g><g fill="#000000" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(0, 0, 0);"><text x="180" y="258">09:02</text><text x="180" y="280">権威 DNS が api.example を</text><text x="180" y="302">198.51.100.22 に変更</text></g></g></g><g data-cell-id="split"><g transform="translate(0.5,0.5)"><rect x="5" y="358" width="350" height="92" rx="13.8" ry="13.8" fill="#ffebe6" stroke="#de350b" pointer-events="all" style="fill: rgb(255, 235, 230); stroke: rgb(222, 53, 11);"/></g><g><g fill="