name: Learning progress integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/fundamentals/**'
      - 'test/progress/**'
      - 'test/data/**'
      - 'supabase/migrations/**'
      - 'scripts/*progress*'
      - 'scripts/render-question-index.ts'
      - 'package.json'
      - 'bun.lock'
      - 'playwright.progress.config.ts'
      - '.github/workflows/progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress_tests:
    name: progress tests (${{ matrix.shard }}/2)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - name: Use Ubuntu archive for browser dependencies
        run: |
          grep -F 'mirror+file:/etc/apt/apt-mirrors.txt' /etc/apt/sources.list.d/ubuntu.sources
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1\nhttps://security.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
      - run: bunx playwright install --with-deps chromium
      - run: bun run progress:integration --shard=${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: learning-progress-results-${{ matrix.shard }}
          path: test-results/progress/
          retention-days: 7
          if-no-files-found: ignore
  progress:
    runs-on: ubuntu-latest
    needs: progress_tests
    if: ${{ always() }}
    steps:
      - name: Require both integration shards to pass
        env:
          KAQ_PROGRESS_SHARDS_RESULT: ${{ needs.progress_tests.result }}
        run: test "$KAQ_PROGRESS_SHARDS_RESULT" = success
