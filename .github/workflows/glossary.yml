name: Glossary
on:
  pull_request:
    paths:
      - 'src/Glossary*.tsx'
      - 'src/glossary*'
      - 'src/locales/**'
      - 'src/preferences.tsx'
      - 'src/style.css'
      - 'scripts/glossary.test.ts'
      - 'test/glossary/**'
      - 'package.json'
      - 'bun.lock'
      - 'biome.json'
      - 'tsconfig.json'
      - '.github/workflows/glossary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  glossary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.5'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test --config test/glossary/playwright.config.ts
