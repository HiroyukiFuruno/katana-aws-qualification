, 112, 100); stroke: rgb(13, 112, 100);"/></g></g><g data-cell-id="measure"><g><rect x="17" y="273" width="358" height="67" rx="5.36" ry="5.36" fill="#ffffff" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(23, 48, 71);"><text x="196" y="304">同じユーザー操作を比較</text><text x="196" y="322">レイテンシー、エラー、ログ、変更時刻</text></g></g></g><g data-cell-id="repair"><g><rect x="17" y="371" width="358" height="78" rx="6.24" ry="6.24" fill="#ffffff" stroke="#915717" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(145, 87, 23);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="196" y="407.5">失敗したワークロードだけを修復</text><text x="196" y="424.5">前提条件を確認し、スコープを限定した IAM ロールを使う</text></g></g></g><g data-cell-id="verify"><g><rect x="17" y="480" width="358" height="67" rx="5.36" ry="5.36" fill="#ffffff" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(23, 48, 71);"><text x="196" y="511">同じ測定で検証</text><text x="196" y="529">成功と停止条件を記録</text></g></g></g><g data-cell-id="stop"><g><rect x="12" y="557" width="368" height="48" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#334D63" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(51, 77, 99);"><text x="196" y="578.5">正常: リリース拡大を検討。</text><text x="196" y="595.5">異常: 停止、エスカレーション、またはロールバック。</text></g></g></g></g></g></g></svg>