 width="180" height="51" rx="7.65" ry="7.65" fill="#ffffff" stroke="#8993a4" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(137, 147, 164);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="middle" font-size="17px" style="fill: rgb(23, 43, 77);"><text x="152" y="435">ACL 送信: TCP 443</text><text x="152" y="455">ACL 受信: TCP 49152</text></g></g></g></g><g data-cell-id="private"><g transform="translate(0.5,0.5)"><path d="M 516 217 L 516 202.15 Q 516 190 503.85 190 L 320.15 190 Q 308 190 308 202.15 L 308 217" fill="#f6f4ff" stroke="#6554c0" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(246, 244, 255); stroke: rgb(101, 84, 192);"/><path d="M 308 217 L 308 469.85 Q 308 482 320.15 482 L 503.85 482 Q 516 482 516 469.85 L 516 217" fill="none" stroke="#6554c0" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(101, 84, 192);"/><path d="M 308 217 L 516 217" fill="none" stroke="#6554c0" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(101, 84, 192);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(23, 43, 77);"><text x="412" y="211.5">プライベート EC2 サブネット</text></g></g><g data-cell-id="private-nacl"><g transform="translate(0.5,0.5)"><rect x="322" y="226" width="180" height="25" rx="3.75" ry="3.75" fill="#fff7d6" stroke="#ffab00" pointer-events="all" style="fill: rgb(255, 247, 214); stroke: rgb(255, 171, 0);"/></g><g><g fill="#594300" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="17px" style="fill: rgb(89, 67, 0);"><text x="412" y="246">ACL</text></g></g></g><g data-cell-id="ec2-sg"><g transform="translate(0.5,0.5)"><rect x="333" y="270" width="158" height="82" rx="12.3" ry="12.3" fill="#eef6ff" stroke="#2684ff" stroke-dasharray="3 3" pointer-events="all" style="fill: rgb(238, 246, 255); stroke: rgb(38, 132, 255);"/></g><g><g fill="#0747A6" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(7, 71, 166);"><text x="412" y="298">EC2 SG</text></g></g><g data-cell-id="ec2"><g transform="translate(0.5,0.5)"><rect x="353" y="304" width="118" height="31" rx="4.65" ry="4.65" fill="#ffffff" stroke="#5e6c84" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(94, 108, 132);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(23, 43, 77);"><text x="412" y="327.5">EC2</text></g></g></g></g><g data-cell-id="private-rules"><g transform="translate(0.5,0.5)"><rect x="322" y="412" width="180" height="51" rx="7.65" ry="7.65" fill="#ffffff" stroke="#8993a4" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(137, 147, 164);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="middle" font-size="17px" style="fill: rgb(23, 43, 77);"><text x="412" y="435">ACL 受信: TCP 443</text><text x="412" y="455">ACL 送信: TCP 49152</text></g></g></g></g><g data-cell-id="request-label"><g><rect x="187" y="246" width="190" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#0052CC" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(0, 82, 204);"><text x="282" y="266">リクエスト: ALB 49152 → EC2 443</text></g></g></g><g data-cell-id="request"><g transform="translate(0.5,0.5)"><path d="M 231 311 L 320.65 311" fill="none" stroke="#0052cc" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(0, 82, 204);"/><path d="M 329.65 311 L 320.65 315.5 L 320.65 306.5 Z" fill="#0052cc" stroke="#0052cc" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(0, 82, 204); stroke: rgb(0, 82, 204);"/></g></g><g data-cell-id="response"><g transform="translate(0.5,0.5)"><path d="M 352.02 352 L 341.26 359.36 Q 333 365 323 365 L 241 365 Q 231 365 226.59 361.99 L 222.18 358.97" fill="none" stroke="#6554c0" stroke-width="3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(101, 84, 192);"/><path d="M 214.75 353.89 L 224.72 355.26 L 219.64 362.69 Z" fill="#6554c0" stroke="#6554c0" stroke-width="3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(101, 84, 192); stroke: rgb(101, 84, 192);"/></g></g><g data-cell-id="response-label"><g><rect x="187" y="383" width="190" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#6554C0" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(101, 84, 192);"><text x="282" y="403">レスポンス: EC2 443 → ALB 49152</text></g></g></g></g><g data-cell-id="route-note"><g><rect x="51" y="486" width="462" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#42526E" font-family="Helvetica" text-anchor="middle" font-size="18px" style="fill: rgb(66, 82, 110);"><text x="282" y="506">ローカル VPC ルートを前提。通信制御だけを示す。</text></g></g></g></g></g><g data-cell-id="compare"><g transform="translate(0.5,0.5)"><path d="M 564 622 L 564 601.1 Q 564 584 546.9 584 L 17.1 584 Q 0 584 0 601.1 L 0 622" fill="#f7fafc" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(247, 250, 252); stroke: rgb(76, 154, 255);"/><path d="M 0 622 L 0 846.9 Q 0 864 17.1 864 L 546.9 864 Q 564 864 564 846.9 L 564 622" fill="none" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(76, 154, 255);"/><path d="M 0 622 L 564 622" fill="none" stroke="#4c9aff" stroke-miterlimit="10" pointer-events="none" style="stroke: rgb(76, 154, 255);"/></g><g><g fill="#172B4D" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(23, 43, 77);"><text x="282" y="611">戻り経路をどう判断するか</text></g></g><g data-cell-id="compare-sg"><g transform="translate(0.5,0.5)"><rect x="18" y="632" width="248" height="200" rx="30" ry="30" fill="#eef6ff" stroke="#2684ff" pointer-events="all" style="fill: rgb(238, 246, 255); stroke: rgb(38, 132, 255);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="start" font-size="17px" style="fill: rgb(23, 43, 77);"><text x="36" y="667">セキュリティグループ（ENI）</text><text x="36" y="707">ステートフル</text><text x="36" y="727">許可: ALB SG → EC2 SG</text><text x="36" y="747">TCP 443</text><text x="36" y="787">戻り: 確立済み通信</text><text x="36" y="807">49152 は不要</text></g></g></g><g data-cell-id="compare-nacl"><g transform="translate(0.5,0.5)"><rect x="298" y="632" width="248" height="200" rx="30" ry="30" fill="#fff7d6" stroke="#ffab00" pointer-events="all" style="fill: rgb(255, 247, 214); stroke: rgb(255, 171, 0);"/></g><g><g fill="#172B4D" font-family="Helvetica" text-anchor="start" font-size="17px" style="fill: rgb(23, 43, 77);"><text x="316" y="667">ACL（サブネット）</text><text x="316" y="707">ステートレス</text><text x="316" y="727">要求: ALB 送信 / EC2 受信</text><text x="316" y="747">TCP 443</text><text x="316" y="787">戻り: EC2 → ALB</text><text x="316" y="807">TCP 49152</text><text x="316" y="827">両方向を許可</text></g></g></g></g><g data-cell-id="footer"><g><rect x="2" y="869" width="560" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#42526E" font-family="Helvetica" text-anchor="middle" font-size="17px" style="fill: rgb(66, 82, 110);"><text x="282" y="888.5">例: 49152。可変時は必要なエフェメラルポート範囲を許可。</text></g></g></g></g></g></g></svg>