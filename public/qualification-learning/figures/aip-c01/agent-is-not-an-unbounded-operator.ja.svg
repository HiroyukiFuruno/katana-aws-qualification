="52" rx="4.5" ry="4.5" fill="#fee2e2" stroke="#dc2626" stroke-width="1.3" pointer-events="all" style="fill: rgb(254, 226, 226); stroke: rgb(220, 38, 38);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="205" y="506.5">人手承認 — 高影響</text><text x="205" y="523.5">対象 • 変更 • 証拠を提示</text></g></g></g><g data-cell-id="tool"><g transform="translate(0.5,0.5)"><rect x="45" y="566" width="320" height="52" rx="4.5" ry="4.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" pointer-events="all" style="fill: rgb(220, 252, 231); stroke: rgb(22, 163, 74);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="589.5">許可済みツール / API</text><text x="205" y="607.5">承認済みまたは低影響の実行</text></g></g></g><g data-cell-id="response"><g transform="translate(0.5,0.5)"><rect x="45" y="640" width="320" height="46" rx="4.5" ry="4.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(37, 99, 235);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="205" y="660.5">応答検証</text><text x="205" y="677.5">安全な応答または安全な失敗</text></g></g></g><g data-cell-id="e1"><g><path d="M 205 101 L 205 154.76" fill="none" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(37, 99, 235);"/><path d="M 205 162.76 L 201 154.76 L 209 154.76 Z" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(37, 99, 235); stroke: rgb(37, 99, 235);"/></g></g><g data-cell-id="e2"><g><path d="M 205 217 L 205 227.76" fill="none" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(37, 99, 235);"/><path d="M 205 235.76 L 201 227.76 L 209 227.76 Z" 