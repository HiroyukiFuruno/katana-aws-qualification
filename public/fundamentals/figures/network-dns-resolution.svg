se cached record</text></g></g></g><g data-cell-id="miss"><g><rect x="8" y="388" width="101" height="29" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24354D" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: rgb(36, 53, 77);"><text x="58.5" y="410">Query on miss</text></g></g></g><g data-cell-id="reply"><g><rect x="304" y="388" width="98" height="29" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#24354D" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: rgb(36, 53, 77);"><text x="353" y="410">Record reply</text></g></g></g><g data-cell-id="query-edge"><g><path d="M 187.6 116 L 187.06 213.13" fill="none" stroke="#245892" stroke-width="2.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(36, 88, 146);"/><path d="M 187.01 221.43 L 182.91 213.11 L 191.21 213.15 Z" fill="#245892" stroke="#245892" stroke-width="2.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(36, 88, 146); stroke: rgb(36, 88, 146);"/></g></g><g data-cell-id="answer-edge"><g><path d="M 229 224 L 227.76 126.87" fill="none" stroke="#14736f" stroke-width="2.3" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(20, 115, 111);"/><path d="M 227.65 118.57 L 231.91 126.82 L 223.61 126.92 Z" fill="#14736f" stroke="#14736f" stroke-width="2.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(20, 115, 111); stroke: rgb(20, 115, 111);"/></g></g><g data-cell-id="miss-edge"><g><path d="M 111 271 L 112.72 429.13" fill="none" stroke="#245892" stroke-width="2.3" stroke-miterlimit="10" stroke-dasharray="6.9 6.9" pointer-events="stroke" style="stroke: rgb(36, 88, 146);"/><path d="M 112.81 437.43 L 108.57 429.17 L 116.87 429.08 Z" fill="#245892" stroke="#245892" stroke-width="2.3" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(36, 88, 146); stroke: rgb(36, 88, 146);"/></g></g><g data-cell-id="reply-edge"><g><path d="M 297.16 440 L 298.88 281.87" fill="none" stroke="