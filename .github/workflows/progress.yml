name: Learning progress integration
on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/fundamentals/**'
      - 'test/progress/**'
      - 'test/data/**'
      - 'supabase/migrations/**'
      - 'scripts/*progress*'
      - 'scripts/render-question-index.ts'
      - 'package.json'
      - 'bun.lock'
      - 'playwright.progress.config.ts'
      - '.github/workflows/progress.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run progress:integration
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: learning-progress-results
          path: test-results/progress/
          retention-days: 7
          if-no-files-found: ignore
