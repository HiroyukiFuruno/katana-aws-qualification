, 71);"><text x="296" y="121">Data owner</text><text x="296" y="138">Lawful use and quality</text><text x="296" y="155">Approves data access</text></g></g></g><g data-cell-id="risk"><g><rect x="20" y="191" width="172" height="72" rx="5.76" ry="5.76" fill="#ffffff" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="106" y="216">Risk owner</text><text x="106" y="233">Defines controls</text><text x="106" y="250">Reviews test evidence</text></g></g></g><g data-cell-id="operate"><g><rect x="210" y="191" width="172" height="72" rx="5.76" ry="5.76" fill="#ffffff" stroke="#915717" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(145, 87, 23);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="296" y="216">Operations</text><text x="296" y="233">Monitors and reports</text><text x="296" y="250">Limits incident impact</text></g></g></g><g data-cell-id="record"><g><rect x="21" y="355" width="360" height="63" rx="5.04" ry="5.04" fill="#ffffff" stroke="#915717" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(145, 87, 23);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="201" y="384">Audit record</text><text x="201" y="401">What happened, who was affected, who owns it</text></g></g></g><g data-cell-id="act"><g><rect x="21" y="439" width="360" height="58" rx="4.64" ry="4.64" fill="#ffffff" stroke="#9c3f47" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(156, 63, 71);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="201" y="465.5">Restrict use, then fix the cause</text><text x="201" y="482.5">Limit the change to the affected workflow</text></g></g></g><g data-cell-id="retest"><g><rect x="21" y="517" width="360" height="67" rx="5.36" ry="5.36" fill="#ffffff" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="201" y="548">Retest the affected workflow</text><text x="201" y="565">Owners reapprove when controls pass</text></g></g></g></g></g></g></svg>