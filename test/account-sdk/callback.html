<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="referrer" content="no-referrer" />
  <title>Account SDK callback</title>
  <main><p role="status">loading</p></main>
  <script>
    const callbackUrl = new URL(location.href);
    const callbackCode = callbackUrl.searchParams.get('code');
    if (callbackCode || callbackUrl.searchParams.has('error')) {
      history.replaceState({}, '', callbackUrl.pathname);
      window.__kaqAccountSdkCallbackCode = callbackCode;
    }
  </script>
  <script type="module" src="/test/account-sdk/browser.ts"></script>
</html>
