<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="411px" height="791px" viewBox="0 0 411 791"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="0" y="0" width="410" height="790" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="title"><g><rect x="15" y="10" width="380" height="34" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="20px" style="fill: rgb(20, 35, 54);"><text x="205" y="36">Untrusted text cannot execute a tool</text></g></g></g><g data-cell-id="untrusted-boundary"><g transform="translate(0.5,0.5)"><rect x="16" y="60" width="378" height="160" rx="4.5" ry="4.5" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="3.9 3.9" pointer-events="all" style="fill: rgb(255, 247, 237); stroke: rgb(234, 88, 12);"/></g></g><g data-cell-id="untrusted-label"><g><rect x="30" y="68" width="350" height="25" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="32" y="87">UNTRUSTED DATA — not an authorization source</text></g></g></g><g data-cell-id="user"><g transform="translate(0.5,0.5)"><rect x="45" y="103" width="320" height="45" rx="4.5" ry="4.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(217, 119, 6);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="123">USER INPUT</text><text x="205" y="141">question or request</text></g></g></g><g data-cell-id="retrieved"><g transform="translate(0.5,0.5)"><rect x="45" y="160" width="320" height="45" rx="4.5" ry="4.5" fill="#fef3c7" stroke="#d97706" stroke-width="1.3" pointer-events="all" style="fill: rgb(254, 243, 199); stroke: rgb(217, 119, 6);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="205" y="180">RETRIEVED TEXT</text><text x="205" y="197">facts to read, not instructions to obey</text></g></g></g><g data-cell-id="app-boundary"><g transform="translate(0.5,0.5)"><rect x="16" y="240" width="378" height="525" rx="4.5" ry="4.5" fill="#f8fafc" stroke="#2563eb" stroke-width="1.3" stroke-dasharray="3.9 3.9" pointer-events="all" style="fill: rgb(248, 250, 252); stroke: rgb(37, 99, 235);"/></g></g><g data-cell-id="app-label"><g><rect x="30" y="248" width="350" height="25" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="32" y="267">APPLICATION TRUST BOUNDARY</text></g></g></g><g data-cell-id="classify"><g transform="translate(0.5,0.5)"><rect x="45" y="285" width="320" height="52" rx="4.5" ry="4.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(37, 99, 235);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="308.5">INPUT CLASSIFICATION</text><text x="205" y="326.5">validate • sanitize • policy</text></g></g></g><g data-cell-id="model"><g transform="translate(0.5,0.5)"><rect x="45" y="363" width="320" height="52" rx="4.5" ry="4.5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.3" pointer-events="all" style="fill: rgb(237, 233, 254); stroke: rgb(124, 58, 237);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="386.5">BEDROCK MODEL</text><text x="205" y="404.5">uses trusted policy and validated context</text></g></g></g><g data-cell-id="proposal"><g transform="translate(0.5,0.5)"><rect x="45" y="440" width="320" height="50" rx="4.5" ry="4.5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.3" pointer-events="all" style="fill: rgb(245, 243, 255); stroke: rgb(124, 58, 237);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="462.5">MODEL PROPOSAL</text><text x="205" y="480.5">candidate operation and arguments only</text></g></g></g><g data-cell-id="gate"><g transform="translate(0.5,0.5)"><rect x="45" y="518" width="320" height="70" rx="4.5" ry="4.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" pointer-events="all" style="fill: rgb(220, 252, 231); stroke: rgb(22, 163, 74);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="541.5">APPLICATION EXECUTION GATE</text><text x="205" y="559.5">authorize actor • validate arguments</text><text x="205" y="577.5">approval when required</text></g></g></g><g data-cell-id="tool"><g transform="translate(0.5,0.5)"><rect x="45" y="615" width="320" height="50" rx="4.5" ry="4.5" fill="#dcfce7" stroke="#16a34a" stroke-width="1.3" pointer-events="all" style="fill: rgb(220, 252, 231); stroke: rgb(22, 163, 74);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="205" y="637.5">LIMITED TOOL / API</text><text x="205" y="655.5">least-privilege execution</text></g></g></g><g data-cell-id="result"><g transform="translate(0.5,0.5)"><rect x="45" y="690" width="320" height="50" rx="4.5" ry="4.5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.3" pointer-events="all" style="fill: rgb(219, 234, 254); stroke: rgb(37, 99, 235);"/></g><g><g fill="#142336" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="205" y="712.5">RESULT VALIDATION</text><text x="205" y="729.5">schema and allowlist before response</text></g></g></g><g data-cell-id="e1"><g><path d="M 45 125.96 L 37.5 125.98 Q 30 126 30 136 L 30 301 Q 30 311 32.38 311 L 34.76 311" fill="none" stroke="#ea580c" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(234, 88, 12);"/><path d="M 42.76 311 L 34.76 315 L 34.76 307 Z" fill="#ea580c" stroke="#ea580c" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(234, 88, 12); stroke: rgb(234, 88, 12);"/></g></g><g data-cell-id="e2"><g><path d="M 365 182.05 L 373.5 182.02 Q 382 182 382 192 L 382 301 Q 382 311 378.62 311 L 375.24 311" fill="none" stroke="#ea580c" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(234, 88, 12);"/><path d="M 367.24 311 L 375.24 307 L 375.24 315 Z" fill="#ea580c" stroke="#ea580c" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(234, 88, 12); stroke: rgb(234, 88, 12);"/></g></g><g data-cell-id="e3"><g><path d="M 205 337 L 205 352.76" fill="none" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(37, 99, 235);"/><path d="M 205 360.76 L 201 352.76 L 209 352.76 Z" fill="#2563eb" stroke="#2563eb" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(37, 99, 235); stroke: rgb(37, 99, 235);"/></g></g><g data-cell-id="e4"><g><path d="M 205 415 L 205 429.76" fill="none" stroke="#7c3aed" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(124, 58, 237);"/><path d="M 205 437.76 L 201 429.76 L 209 429.76 Z" fill="#7c3aed" stroke="#7c3aed" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(124, 58, 237); stroke: rgb(124, 58