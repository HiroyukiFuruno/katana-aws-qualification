 rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="314" y="262">True positive</text></g></g></g><g data-cell-id="cost"><g><rect x="12" y="304" width="368" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#334D63" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(51, 77, 99);"><text x="196" y="324.5">Lower risk threshold: fewer misses,</text><text x="196" y="342.5">more false alerts to investigate.</text></g></g></g><g data-cell-id="compare"><g><rect x="12" y="354" width="368" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#334D63" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(51, 77, 99);"><text x="196" y="383">Compare thresholds on the same validation set.</text></g></g></g></g></g></g></svg>