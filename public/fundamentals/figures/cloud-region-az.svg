<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="336px" height="516px" viewBox="0 0 336 516"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="5" y="5" width="320" height="500" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="title"><g><rect x="13" y="13" width="304" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(20, 35, 54);"><text x="165" y="34.5">Which failure scope is isolated?</text></g></g></g><g data-cell-id="region"><g><rect x="15" y="53" width="300" height="345" rx="4" ry="4" fill="#f4f8fd" stroke="#4976a5" stroke-width="1.5" pointer-events="all" style="fill: rgb(244, 248, 253); stroke: rgb(73, 118, 165);"/></g><g data-cell-id="region-title"><g><rect x="27" y="61" width="150" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="start" font-size="16px" style="fill: rgb(20, 35, 54);"><text x="29" y="78">AWS Region</text></g></g></g><g data-cell-id="routing"><g transform="translate(0.5,0.5)"><rect x="87" y="88" width="156" height="45" rx="3" ry="3" fill="#e7f0fa" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="165" y="108">Regional routing uses</text><text x="165" y="125">health of each replica</text></g></g></g><g data-cell-id="aza"><g transform="translate(0.5,0.5)"><rect x="30" y="154" width="270" height="93" rx="3" ry="3" fill="#fff8f6" stroke="#c46a56" stroke-width="1.3" stroke-dasharray="3.9 3.9" pointer-events="all" style="fill: rgb(255, 248, 246); stroke: rgb(196, 106, 86);"/></g><g data-cell-id="aza-title"><g><rect x="40" y="162" width="170" height="19" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="42" y="178">Availability Zone A</text></g></g></g><g data-cell-id="app-a"><g transform="translate(0.5,0.5)"><rect x="44" y="194" width="120" height="34" rx="3" ry="3" fill="#ffffff" stroke="#c46a56" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(196, 106, 86);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="104" y="217">Replica A</text></g></g></g><g data-cell-id="failure"><g transform="translate(0.5,0.5)"><rect x="180" y="188" width="106" height="45" rx="3" ry="3" fill="#fce8e6" stroke="#c43a31" stroke-width="1.3" pointer-events="all" style="fill: rgb(252, 232, 230); stroke: rgb(196, 58, 49);"/></g><g><g fill="#8B251F" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(139, 37, 31);"><text x="233" y="208">AZ failed</text><text x="233" y="225">No traffic</text></g></g></g></g><g data-cell-id="azb"><g transform="translate(0.5,0.5)"><rect x="30" y="268" width="270" height="93" rx="3" ry="3" fill="#f4fbf5" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(244, 251, 245); stroke: rgb(99, 139, 82);"/></g><g data-cell-id="azb-title"><g><rect x="40" y="276" width="170" height="19" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="42" y="292">Availability Zone B</text></g></g></g><g data-cell-id="app-b"><g transform="translate(0.5,0.5)"><rect x="44" y="308" width="120" height="34" rx="3" ry="3" fill="#ffffff" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="104" y="331">Replica B</text></g></g></g><g data-cell-id="healthy"><g transform="translate(0.5,0.5)"><rect x="180" y="302" width="106" height="45" rx="3" ry="3" fill="#e7f4ea" stroke="#4c8b60" stroke-width="1.3" pointer-events="all" style="fill: rgb(231, 244, 234); stroke: rgb(76, 139, 96);"/></g><g><g fill="#245633" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(36, 86, 51);"><text x="233" y="322">Healthy</text><text x="233" y="339">Serves traffic</text></g></g></g></g></g><g data-cell-id="region-failure"><g transform="translate(0.5,0.5)"><rect x="15" y="415" width="300" height="60" rx="3" ry="3" fill="#fff5e7" stroke="#b87526" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 245, 231); stroke: rgb(184, 117, 38);"/></g><g><g fill="#4B351B" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(75, 53, 27);"><text x="165" y="434.5">A Region failure can affect both AZs.</text><text x="165" y="450.5">Cross-Region recovery requires</text><text x="165" y="466.5">separate replication and routing.</text></g></g></g></g></g></g></svg>