<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="404px" height="480px" viewBox="0 0 404 480"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g><rect x="5" y="5" width="388" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#173047" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="21px" style="fill: rgb(23, 48, 71);"><text x="199" y="32.5">Choose how to return an ML result</text></g></g></g><g data-cell-id="mode"><g><rect x="11" y="55" width="111" height="39" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#23648A" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 100, 138);"><text x="66.5" y="80.5">MODE</text></g></g></g><g data-cell-id="start"><g><rect x="130" y="55" width="115" height="39" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#23648A" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 100, 138);"><text x="187.5" y="80.5">CLIENT SENDS</text></g></g></g><g data-cell-id="result"><g><rect x="253" y="55" width="134" height="39" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#23648A" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(35, 100, 138);"><text x="320" y="80.5">CLIENT GETS</text></g></g></g><g data-cell-id="reallabel"><g><rect x="11" y="100" width="111" height="86" rx="6.88" ry="6.88" fill="#e2f1fb" stroke="#23648a" stroke-width="1.5" pointer-events="all" style="fill: rgb(226, 241, 251); stroke: rgb(35, 100, 138);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="66.5" y="149">Real-time</text></g></g></g><g data-cell-id="realstart"><g><rect x="130" y="100" width="115" height="86" rx="6.88" ry="6.88" fill="#ffffff" stroke="#23648a" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(35, 100, 138);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="187.5" y="149">One request</text></g></g></g><g data-cell-id="realresult"><g><rect x="253" y="100" width="134" height="86" rx="6.88" ry="6.88" fill="#ffffff" stroke="#23648a" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(35, 100, 138);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="320" y="140.5">Result during</text><text x="320" y="157.5">the request</text></g></g></g><g data-cell-id="asynclabel"><g><rect x="11" y="204" width="111" height="86" rx="6.88" ry="6.88" fill="#e8f5f0" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(232, 245, 240); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="66.5" y="253">Asynchronous</text></g></g></g><g data-cell-id="asyncstart"><g><rect x="130" y="204" width="115" height="86" rx="6.88" ry="6.88" fill="#ffffff" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="187.5" y="253">Input to queue</text></g></g></g><g data-cell-id="asyncresult"><g><rect x="253" y="204" width="134" height="86" rx="6.88" ry="6.88" fill="#ffffff" stroke="#0d7064" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(13, 112, 100);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="320" y="244.5">Result later</text><text x="320" y="261.5">when ready</text></g></g></g><g data-cell-id="batchlabel"><g><rect x="11" y="308" width="111" height="86" rx="6.88" ry="6.88" fill="#fff3df" stroke="#915717" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 243, 223); stroke: rgb(145, 87, 23);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="66.5" y="357">Batch</text></g></g></g><g data-cell-id="batchstart"><g><rect x="130" y="308" width="115" height="86" rx="6.88" ry="6.88" fill="#ffffff" stroke="#915717" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(145, 87, 23);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="187.5" y="357">A body of inputs</text></g></g></g><g data-cell-id="batchresult"><g><rect x="253" y="308" width="134" height="86" rx="6.88" ry="6.88" fill="#ffffff" stroke="#915717" stroke-width="1.5" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(145, 87, 23);"/></g><g><g fill="#173047" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(23, 48, 71);"><text x="320" y="348.5">Results after</text><text x="320" y="365.5">the batch job</text></g></g></g><g data-cell-id="stream"><g><rect x="11" y="401" width="376" height="68" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#334D63" font-family="Arial" text-anchor="middle" font-size="14px" style="fill: rgb(51, 77, 99);"><text x="199" y="432.5">A real-time generative response can stream.</text><text x="199" y="449.5">The client sees chunks while generation continues.</text></g></g></g></g></g></g></svg>