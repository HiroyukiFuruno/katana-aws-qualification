 x="101.5" y="505.5">対象リソース</text></g></g></g><g data-cell-id="rule"><g><rect x="14" y="537" width="363" height="31" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#9C3F47" font-family="Arial" text-anchor="middle" font-size="15px" style="fill: rgb(156, 63, 71);"><text x="195.5" y="559">明示的な拒否は許可より優先される。</text></g></g></g></g></g></g></svg>