<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #FFFFFF; background-color: #FFFFFF; color-scheme: light;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="321px" height="621px" viewBox="0 0 321 621"><defs/><rect fill="#FFFFFF" width="100%" height="100%" x="0" y="0" style="fill: rgb(255, 255, 255);"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="canvas"><g><rect x="0" y="0" width="320" height="620" fill="#ffffff" stroke="none" pointer-events="all" style="fill: rgb(255, 255, 255);"/></g></g><g data-cell-id="title"><g><rect x="8" y="8" width="304" height="27" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="18px" style="fill: rgb(20, 35, 54);"><text x="160" y="29.5">ロールバックを考慮したスキーマ変更</text></g></g></g><g data-cell-id="old-app"><g transform="translate(0.5,0.5)"><rect x="18" y="56" width="124" height="52" rx="3" ry="3" fill="#e7f0fa" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="80" y="79.5">旧アプリ</text><text x="80" y="97.5">ロールバック先</text></g></g></g><g data-cell-id="new-app"><g transform="translate(0.5,0.5)"><rect x="178" y="56" width="124" height="52" rx="3" ry="3" fill="#ecf5e9" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="240" y="79.5">新アプリ</text><text x="240" y="97.5">互換コード</text></g></g></g><g data-cell-id="access-cue"><g><rect x="18" y="119" width="284" height="18" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#234D77" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(35, 77, 119);"><text x="160" y="133.5">両リリースが共有データベースを読み書きする</text></g></g></g><g data-cell-id="db-boundary"><g transform="translate(0.5,0.5)"><rect x="10" y="153" width="300" height="384" rx="4" ry="4" fill="#f8fafd" stroke="#4976a5" stroke-width="1.4" pointer-events="all" style="fill: rgb(248, 250, 253); stroke: rgb(73, 118, 165);"/></g><g data-cell-id="db-title"><g><rect x="22" y="161" width="270" height="20" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="start" font-size="15px" style="fill: rgb(20, 35, 54);"><text x="24" y="177.5">共有注文データベースの境界</text></g></g></g><g data-cell-id="expand"><g transform="translate(0.5,0.5)"><rect x="28" y="199" width="264" height="51" rx="3" ry="3" fill="#e7f0fa" stroke="#4976a5" stroke-width="1.3" pointer-events="all" style="fill: rgb(231, 240, 250); stroke: rgb(73, 118, 165);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="14px" style="fill: rgb(20, 35, 54);"><text x="160" y="222">1  拡張</text><text x="160" y="239">NULL 許可列 delivery_class を追加</text></g></g></g><g data-cell-id="compatible"><g transform="translate(0.5,0.5)"><rect x="28" y="268" width="264" height="65" rx="3" ry="3" fill="#ecf5e9" stroke="#638b52" stroke-width="1.3" pointer-events="all" style="fill: rgb(236, 245, 233); stroke: rgb(99, 139, 82);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="160" y="290">2  互換性確保</text><text x="160" y="306">旧アプリは新しい列を無視</text><text x="160" y="322">新アプリは旧フィールドを利用可能に保つ</text></g></g></g><g data-cell-id="verify"><g transform="translate(0.5,0.5)"><rect x="28" y="351" width="264" height="65" rx="3" ry="3" fill="#fff5e7" stroke="#b87526" stroke-width="1.3" pointer-events="all" style="fill: rgb(255, 245, 231); stroke: rgb(184, 117, 38);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="160" y="373">3  移行と検証</text><text x="160" y="389">注文データをバックフィル</text><text x="160" y="405">移行後の値を検証</text></g></g></g><g data-cell-id="contract"><g transform="translate(0.5,0.5)"><rect x="28" y="434" width="264" height="65" rx="3" ry="3" fill="#f3f5f7" stroke="#667788" stroke-width="1.3" pointer-events="all" style="fill: rgb(243, 245, 247); stroke: rgb(102, 119, 136);"/></g><g><g fill="#142336" font-family="Arial" font-weight="bold" text-anchor="middle" font-size="13px" style="fill: rgb(20, 35, 54);"><text x="160" y="456">4  縮小（後で）</text><text x="160" y="472">旧アプリを廃止した後にのみ</text><text x="160" y="488">古い列を削除</text></g></g></g></g><g data-cell-id="cue"><g transform="translate(0.5,0.5)"><rect x="10" y="555" width="300" height="48" rx="3" ry="3" fill="#ffffff" stroke="#b87526" stroke-width="1.2" pointer-events="all" style="fill: rgb(255, 255, 255); stroke: rgb(184, 117, 38);"/></g><g><g fill="#4B351B" font-family="Arial" text-anchor="middle" font-size="13px" style="fill: rgb(75, 53, 27);"><text x="160" y="576.5">ロールバックは旧コードへ戻す。</text><text x="160" y="592.5">DB データは戻らない。</text></g></g></g><g data-cell-id="e-compat"><g><path d="M 160 250 L 160 257.76" fill="none" stroke="#638b52" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(99, 139, 82);"/><path d="M 160 265.76 L 156 257.76 L 164 257.76 Z" fill="#638b52" stroke="#638b52" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(99, 139, 82); stroke: rgb(99, 139, 82);"/></g></g><g data-cell-id="e-verify"><g><path d="M 160 333 L 160 340.76" fill="none" stroke="#b87526" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(184, 117, 38);"/><path d="M 160 348.76 L 156 340.76 L 164 340.76 Z" fill="#b87526" stroke="#b87526" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(184, 117, 38); stroke: rgb(184, 117, 38);"/></g></g><g data-cell-id="e-contract"><g><path d="M 160 416 L 160 423.76" fill="none" stroke="#667788" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: rgb(102, 119, 136);"/><path d="M 160 431.76 L 156 423.76 L 164 423.76 Z" fill="#667788" stroke="#667788" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: rgb(102, 119, 136); stroke: rgb(102, 119, 136);"/></g></g></g></g></g></svg>